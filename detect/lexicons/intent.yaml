  # ------------------------------------------------------------------ money_move
  # Strong scam phrases only: generic banking words (refund, beneficiary, transfer) appear on every
  # genuine bank page and in genuine calls.
  - {id: money_safe_account, tactic: money_move, weight: 0.5,
     patterns: {en: [safe account, secure account, rbi account, rbi safe account], hi_latn: [safe account mein],
                hi_deva: []}}
  - {id: money_safe_account_call, tactic: money_move, weight: 0.5, where: [call],
