                     transfer your funds, make the payment now],
                hi_latn: [turant transfer karo, paise transfer karo, paisa bhejo, amount transfer kijiye], hi_deva: []}}
  - {id: money_otp, tactic: money_move, weight: 0.5, where: [call],
