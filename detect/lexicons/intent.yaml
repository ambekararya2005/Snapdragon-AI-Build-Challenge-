# Scam-tactic lexicon: the ONE source for call tactics (detect/intent.py) and screen tactics
# (detect/screen_classifier.py via screen.yaml `tactics_from`). Shared matcher: detect/tactic_lexicon.py.
#
# Entry fields:
#   id        stable evidence id (never transcript/screen text)
#   tactic    authority | threat | secrecy | urgency | money_move
#   weight    points when the entry matches (tactic score = combination of entry weights, see below)
#   where     channels the entry applies to: [call, screen] (default both)
#   patterns  per script/language:
#               en       English
#               hi_latn  romanised Hindi / Hinglish ("arrest ho jayega")
#               hi_deva  Devanagari Hindi (P1: add entries here; matching already keeps Devanagari letters)
#   regex     optional raw regexes, matched against the canonical (lowercase) text
#
# Matching: patterns are canonicalised like the text. Every pattern matches exactly on word boundaries
# (punctuation/spaces between words are flexible: "don't" == "dont"). On calls, patterns with >= 8
# letters also match fuzzily (rapidfuzz partial_ratio >= intent.fuzzy_threshold, aligned to word
# boundaries) to survive ASR errors ("diggital arrest", "safe acount"). Common ASR spellings of short
# tokens are listed explicitly ("see bee eye"). A match inside a longer match of the same tactic in the
# same sentence is not counted twice ("arrest" inside "digital arrest").
#
# Entries shared with the screen keep the screen's original weights (0.5; urgency 0.35) so screen
# scores do not change. Call-only phrasing lives in `where: [call]` entries.

reporting:        # third-person / news / advisory language: same sentence -> weight * intent.reporting_factor
  en: [scammer, scammers, scam, scams, fraudster, fraudsters, fraud gang, cyber criminals, criminals,
       victim, victims, police said, police say, officials said, officials say, reported, according to,
       in this video, beware, warned, warns, warning to citizens, citizens, advisory, awareness,
       pretend to be, pretending to be, posing as, posed as, impersonating, duped, lost rs, lakh rupees,
       headlines, news, complaint was filed, how to stay safe, never asks, never ask, will never ask,
       will ever ask, does not ask, do not fall, report it, helpline, if you receive,
       never need to enter, never need a pin, pin is not required, not required to receive]
  hi_latn: [thag, thagon, dhokhebaaz, thagi, khabar]
  hi_deva: []

second_person:    # addressing the listener in the same sentence -> weight * intent.second_person_boost
  en: [you, your, yours, yourself]
  hi_latn: [aap, aapka, aapke, aapki, aapko, aapne, tum, tumhara, tumhare, tumhari, tumko, tera, teri, tujhe]
  hi_deva: []

