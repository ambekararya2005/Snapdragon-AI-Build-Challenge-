                     share your pin, tell me your pin, tell me your cvv],
                hi_latn: [otp batao, otp bataiye, otp share karo, otp bolo], hi_deva: []}}
  # UPI collect-request scam: receiving money never needs a PIN, so being told to enter one to RECEIVE is
  # the tell. Genuine apps' tip ("you never need to enter your PIN to receive money") is damped by the
  # screen disclaimer terms (screen.yaml bank_disclaimer) and the call reporting terms above.
  - {id: money_pin_to_receive, tactic: money_move, weight: 0.5,
     patterns: {en: [pin to receive, pin to get the money, pin to get your money, approve the request to receive,
                     accept the request to receive, approve the collect request, accept the collect request],
                hi_latn: [receive karne ke liye pin, paise lene ke liye pin, paisa lene ke liye pin,
                          pin daalo paise aa jayenge, pin dalo paise aa jayenge, pin daalo paisa aa jayega,
                          pin dalo paisa aa jayega, pin daaliye paise aa jayenge], hi_deva: []}}
  # Remote access alone is weak on purpose: genuine IT support uses AnyDesk too. The remote_tool
  # fusion signal already covers the tool itself.
  - {id: money_remote_access, tactic: money_move, weight: 0.15, where: [call],
     patterns: {en: [anydesk, any desk, teamviewer, team viewer, quick support, rustdesk, install anydesk,
                     share your screen, share screen, screen share], hi_latn: [], hi_deva: []}}
