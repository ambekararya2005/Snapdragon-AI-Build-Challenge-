# Kavach configuration. Override path with KAVACH_CONFIG, provider with KAVACH_PROVIDER.

runtime:
  provider: dml            # qnn | cuda | dml | cpu
  fallback_to_cpu: true    # if the provider is unavailable, use CPU and log a warning
  log_latency: true
  qnn:
    backend_path: QnnHtp.dll
    htp_performance_mode: burst
    enable_htp_fp16_precision: "1"
  dml:
    device_id: 1           # dev PC: 0 = Radeon iGPU (Ryzen), 1 = RTX 4050 (DXGI adapter order)
  cuda:
    device_id: 0

privacy:
  debug_show_text: false   # if true, logs/dashboard may show OCR text and transcripts
  write_raw_to_disk: false # MUST stay false; the config loader errors if true

processes:
  poll_interval_s: 2.0
  known_tools:
    # idle_args: a current-user process whose cmdline has one of these is role "tray"
    # (installed / idle, not live remote access). Matched per argument, case-insensitive.
    - name: AnyDesk
      exe_names: [AnyDesk.exe]
      idle_args: ["--service", "--control", "--tray", "--backend"]
    - name: TeamViewer
      exe_names: [TeamViewer.exe, TeamViewer_Service.exe]
      idle_args: []
    - name: RustDesk
      exe_names: [rustdesk.exe]
    - name: Quick Assist
      exe_names: [QuickAssist.exe]
    - name: UltraViewer
      exe_names: [UltraViewer_Desktop.exe, UltraViewer_Service.exe]
    - name: AnyViewer
      exe_names: [AnyViewer.exe, RCClient.exe]
    - name: HopToDesk
      exe_names: [HopToDesk.exe]
    - name: ScreenConnect
      exe_names: [ScreenConnect.ClientService.exe, ScreenConnect.WindowsClient.exe]
    - name: Supremo
      exe_names: [Supremo.exe]
    - name: AweSun
      exe_names: [AweSun.exe]
    - name: Ammyy
      exe_names: [AA_v3.exe]
  extra_exe_names: []      # for testing, e.g. [notepad.exe]

screen:
  interval_s: 2.5
  change_threshold: 4.0    # mean abs pixel diff needed to re-run OCR
  force_on_title_change: true
  exclude_title_prefixes: ["Kavach"]
  exclude_window_classes: [Shell_TrayWnd, Shell_SecondaryTrayWnd, Progman, WorkerW]  # taskbars, desktop
  # Browser tab strip cropped off the top before OCR (address bar kept; the active tab's title
  # still comes from the window title). Values in px at 100% scaling (96 DPI), scaled by the
  # window's DPI. Measured on the dev PC at 125%, dark theme:
  browser_top_crop_px:
    chrome.exe: 41     # measured: 51 px @125%, maximized (tab titles y<=36, address bar y>=70)
    msedge.exe: 40     # measured: 50 px @125%, maximized and restored (titles y<=34, address bar y>=65)
    brave.exe: 41      # NOT measured (not installed); Chromium, assumed same as Chrome
    firefox.exe: 44    # NOT measured (not installed); estimate, re-measure on a PC with Firefox
  max_side: 1920

ocr:
  backend: rapidocr        # rapidocr | native
  min_confidence: 0.5
  det_model: weights/ocr/det.onnx      # scripts\fetch_ocr_models.py copies these out of rapidocr_onnxruntime
  rec_model: weights/ocr/rec.onnx
  cls_model: weights/ocr/cls.onnx
  keys: weights/ocr/keys.txt
  use_cls: false           # 0/180 deg text classifier; screen text is upright, so skip it (saves latency)
  det_input_hw: [736, 1280]
  # Native backend rec: one static model per width bucket. Each line goes to the smallest bucket
  # that fits its width at rec_height; wider than the last bucket -> squashed to it.
  # Line widths on the mock bank page (Chrome @125%, scripts\measure_rec_widths.py):
  # p50 211, p75 322, p95 1144, max 1913 -> 320 covers ~72%, 640 ~86%, 1280 ~98% of lines.
  rec_height: 48
  rec_buckets: [320, 640, 1280]
  rec_batch: {320: 8, 640: 8, 1280: 4}   # per-bucket static batch size (an int applies to all buckets)

audio:                     # capture/audio.py: system audio (WASAPI loopback) -> mono chunks for ASR; RAM only
  sample_rate: 16000       # ASR input rate; the device's native rate is resampled to this
  chunk_s: 5               # chunk length in seconds
  overlap_s: 1.0           # each chunk repeats the last overlap_s of the previous one (phrases not cut)
  # is_speech = rms >= silence_rms AND (voiced fraction >= vad_min_voiced OR rms >= loud_rms)
  silence_rms: 0.005       # chunks below this RMS (full scale 1.0, ~ -46 dBFS) are is_speech=False, not sent to ASR
  loud_rms: 0.015          # ~ -36 dBFS: speech even if the voiced check fails (narrowband call audio)
  vad_frame_ms: 30         # a frame is voiced if RMS >= silence_rms and its zero-crossing
  vad_zcr: [0.01, 0.25]    #   rate is in this range (white noise ~0.5)
  vad_min_voiced: 0.03     # fraction of voiced frames needed (below loud_rms)
  capture_mic: false       # also capture the default microphone as a separate source="mic" stream
  device_check_s: 10       # check for a new default output/input device (reopen streams on change)
  retry_s: 5               # retry interval after device errors

asr:                       # models/asr.py (F4); transcripts stay in RAM
  backend: aihub_whisper   # aihub_whisper (ONNX via models.runtime: qnn/dml/cpu) | faster_whisper (dev-only CPU fallback)
  model: whisper_base      # weights/asr/<model>/ from scripts/export_whisper.py (whisper_tiny if base is too slow)
  language: en
  max_tokens: 96           # decoded tokens per chunk (5 s of speech is ~15-40 tokens; model window is 200)
  rolling_s: 180           # rolling transcript kept in RAM
  max_ngram_repeats: 4     # drop outputs where the same 1-4 word n-gram repeats this many times in a row
  drop_phrases: ["thank you for watching", "thanks for watching", "subscribe", "you"]   # Whisper silence phrases
  faster_whisper_model: base.en   # faster_whisper backend only
  faster_whisper_compute: int8

screen_classifier:         # detect/screen_classifier.py; keywords/weights in detect/lexicons/screen.yaml
  lexicon: detect/lexicons/screen.yaml
  label_threshold: 0.5     # a label is "present" at or above this score
  tactic_threshold: 0.5    # a screen tactic is reported at or above this score
  news_min_hits: 2         # news site/word hits (title + text) needed to treat the screen as an article
  news_factor: 0.3         # multiply the scores below by this on news/article screens
  # An article *about* scams quotes threats, authorities and "safe accounts"; reduce all tactics,
  # not only threat, or reading the news would add fusion points.
  news_reduces: [fake_alert, threat, authority, secrecy, urgency, money_move]
  compact_min_len: 6       # terms with >= this many letters also match in space-stripped text
  # Genuine bank anti-fraud notices ("never share your OTP", "regulated by RBI", "report fraud"):
  # screen tactics found in the same sentence/line are multiplied by this.
  disclaimer_factor: 0.2

intent:                    # detect/intent.py (F5): scam tactics in the rolling call transcript
  lexicon: detect/lexicons/intent.yaml   # shared with screen_classifier (screen.yaml tactics_from)
  tactic_threshold: 0.5    # a tactic counts (fusion call_tactic) at or above this score
  fuzzy_threshold: 85      # rapidfuzz score for ASR-garbled phrases ("diggital arrest")
  fuzzy_min_len: 8         # only patterns with >= this many letters are matched fuzzily; digits never
  second_person_boost: 1.2 # "you"/"aapka" in the same sentence
  reporting_factor: 0.25   # "scammers", "police said", "beware"... in the same sentence (news/explainers)
  repeat_decay: 0.5        # 2nd, 3rd... entry of a tactic counts 0.5, 0.25... (many weak mentions stay weak)
  max_sentence_words: 30   # unpunctuated ASR text is cut into sentences of at most this many words

fusion:
  # weight = points per hit; decay_s = seconds a hit keeps counting (null = while active); cap = max points
  signals:
    remote_tool:  {weight: 30, decay_s: null, cap: 30}   # counts while the tool is running
    money_screen: {weight: 25, decay_s: 120,  cap: 25}
    otp_card:     {weight: 20, decay_s: 120,  cap: 20}
    fake_alert:   {weight: 15, decay_s: 120,  cap: 30}   # per tactic
    fake_alert_label: {weight: 20, decay_s: 120, cap: 20}   # screen label fake_alert >= 0.5
    call_tactic:  {weight: 10, decay_s: 180,  cap: 40}   # per tactic
    combo_bonus:  {weight: 20, decay_s: null, cap: 20}
  bands:
    caution: 50
    alert: 70

logging:
  level: INFO
  dir: logs/

bench:                     # dev-time only (bench/aihub_profile.py); never used by the runtime pipeline
  # Qualcomm AI Hub device names: python -m bench.aihub_profile --list-devices
  aihub_device: "Snapdragon X Elite CRD"
  aihub_devices_extra: []  # optional extra devices, e.g. ["Snapdragon X Plus 8-Core CRD"]
  aihub_target_runtime: precompiled_qnn_onnx   # ONNX Runtime + QNN EP (QNN context binary in ONNX)
  aihub_fallback_runtime: onnx                 # used only if the server rejects the preferred runtime
